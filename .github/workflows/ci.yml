# Runs on every push and pull request: backend tests against a real Postgres
# (with every Alembic migration applied), the frontend's lint, tests and
# production build, and a known-vulnerability check of every locked
# dependency (Python and npm). A red check here means the change is not
# ready to merge.
#
# The runner image is pinned (ubuntu-24.04, not ubuntu-latest) so that a
# GitHub image change cannot turn CI red on its own; move it deliberately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netease
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: netease_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netease -d netease_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://netease:ci-only-password@localhost:5432/netease_db
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install PDF libraries (reports)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check there is a single migration head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Run tests
        run: uv run pytest -q -p no:warnings

  image:
    name: Backend image (build and smoke test)
    # The production image as customers get it (Dockerfile.ngcorion, target
    # production): built from docker.io and pypi.org instead of the Iranian
    # mirrors, started against a real Postgres, then checked from outside.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netease
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: netease_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netease -d netease_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build -f Dockerfile.ngcorion --target production \
            --build-arg BASE_REGISTRY=docker.io \
            --build-arg PYPI_INDEX=https://pypi.org/simple \
            --build-arg NGCORION_VERSION=ci \
            -t ngcorion/backend:ci .
      - name: Nothing secret or unneeded is baked in
        run: |
          docker run --rm --entrypoint sh ngcorion/backend:ci -c '
            set -e
            for f in .env .git traefik/certs tests front/src front/node_modules; do
              if [ -e "/app/$f" ]; then echo "image contains /app/$f"; exit 1; fi
            done
            test -f /app/front/dist/index.html
            test "$(stat -c %U /app/app/main.py)" = root
            if setpriv --reuid=10001 --regid=10001 --clear-groups touch /app/app/x 2>/dev/null; then
              echo "the app user can write its own code"; exit 1
            fi'
      - name: Start and answer
        run: |
          # Settings arrive the way docker-compose.yml passes them: the
          # installation's .env as an env file (the image has none of its own).
          printf 'SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789\n' > ci.env
          docker run -d --name ngcorion --network host --env-file ci.env \
            -e DATABASE_URL=postgresql+psycopg://netease:ci-only-password@127.0.0.1:5432/netease_db \
            -e LICENSE_SERVER_URL=https://license.invalid \
            -e LICENSE_STORAGE_DIR=/var/lib/ngcorion/license \
            ngcorion/backend:ci uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          docker logs ngcorion 2>&1 | tail -20
          curl -sf http://127.0.0.1:8000/health | grep -q '"database":"ok"'
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker logs ngcorion 2>&1 | grep -q "Running as uid 10001"
          # The PDF libraries are present (WeasyPrint loads Pango).
          docker exec ngcorion python -c "import weasyprint"

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Every UI text has a Persian translation
        run: npm run i18n:check
      - name: Production build
        run: npm run build

  dependencies:
    name: Dependencies (known vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Python packages (pip-audit, against uv.lock)
        # Exceptions, each reviewed (see SECURITY.md, "Dependency exceptions"):
        #   PYSEC-2026-2858 / CVE-2026-44405 - paramiko 4 still allows SHA-1
        #     (ssh-rsa signatures, sha1 key exchange) as a fallback. Paramiko 5
        #     removes it, which would make older network devices (IOS 12/15.0,
        #     old ESXi) unreachable for audit; SHA-2 is preferred whenever the
        #     device offers it.
        run: |
          uv export --frozen --format requirements-txt --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit --disable-pip --no-deps --strict -r /tmp/requirements.txt \
            --ignore-vuln PYSEC-2026-2858
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm packages (npm audit)
        working-directory: front
        run: npm audit --audit-level=moderate
