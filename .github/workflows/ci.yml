# Runs on every push and pull request: backend tests against a real Postgres
# (with every Alembic migration applied), the frontend's lint, tests and
# production build, and a known-vulnerability check of every locked
# dependency (Python and npm). A red check here means the change is not
# ready to merge.
#
# The runner image is pinned (ubuntu-24.04, not ubuntu-latest) so that a
# GitHub image change cannot turn CI red on its own; move it deliberately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netease
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: netease_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netease -d netease_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://netease:ci-only-password@localhost:5432/netease_db
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install PDF libraries (reports)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Lint (ruff, rules in pyproject.toml)
        run: uvx ruff@0.15.8 check app tests alembic
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check there is a single migration head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Every model table comes from a migration
        run: uv run python scripts/check_migrations_cover_models.py
      - name: Run tests
        run: uv run pytest -q -p no:warnings

  image:
    name: Backend image (build and smoke test)
    # The production image as customers get it (Dockerfile.ngcorion, target
    # production): built from docker.io and pypi.org instead of the Iranian
    # mirrors, started against a real Postgres, then checked from outside.
    # Compiling the app package (scripts/compile_app.py) is most of the time.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netease
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: netease_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netease -d netease_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build -f Dockerfile.ngcorion --target production \
            --build-arg BASE_REGISTRY=docker.io \
            --build-arg PYPI_INDEX=https://pypi.org/simple \
            --build-arg NGCORION_VERSION=ci \
            -t ngcorion/backend:ci .
      - name: Nothing secret or unneeded is baked in
        run: |
          docker run --rm --entrypoint sh ngcorion/backend:ci -c '
            set -e
            for f in .env .git traefik/certs tests front/src front/node_modules; do
              if [ -e "/app/$f" ]; then echo "image contains /app/$f"; exit 1; fi
            done
            test -f /app/front/dist/index.html
            test "$(stat -c %U /app/app)" = root
            test "$(stat -c %U /app/app/main.cpython-*.so)" = root
            if setpriv --reuid=10001 --regid=10001 --clear-groups touch /app/app/x 2>/dev/null; then
              echo "the app user can write its own code"; exit 1
            fi
            # Compiled: no module source but package markers, the schema modules
            # scripts/compile_app.py keeps (KEEP_AS_SOURCE) and the python -m
            # entry points (RUN_AS_MAIN).
            left=$(cd /app && find app -name "*.py" ! -name "__init__.py" | sort | tr "\n" " ")
            test "$left" = "app/modules/assets/schemas.py app/modules/audit_archive/__main__.py app/modules/hardening/schemas/base.py app/modules/shared/schemas/base.py app/modules/sysbackup/cli.py " \
              || { echo "source left in the image: $left"; exit 1; }
            for m in main core/license_client core/license_state core/license_token core/asset_entitlement core/dependencies middleware/license_middleware; do
              ls /app/app/$m.cpython-*.so >/dev/null || { echo "app/$m is not compiled"; exit 1; }
            done'
      - name: Start and answer
        run: |
          # Settings arrive the way docker-compose.yml passes them: the
          # installation's .env as an env file (the image has none of its own).
          printf 'SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789\n' > ci.env
          docker run -d --name ngcorion --network host --env-file ci.env \
            -e DATABASE_URL=postgresql+psycopg://netease:ci-only-password@127.0.0.1:5432/netease_db \
            -e LICENSE_STORAGE_DIR=/var/lib/ngcorion/license \
            ngcorion/backend:ci uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          docker logs ngcorion 2>&1 | tail -20
          curl -sf http://127.0.0.1:8000/health | grep -q '"database":"ok"'
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker logs ngcorion 2>&1 | grep -q "Running as uid 10001"
          # The PDF libraries are present (WeasyPrint loads Pango).
          docker exec ngcorion python -c "import weasyprint"
          # The command-line tools the admin guide gives run on the compiled code.
          docker exec -w /app ngcorion python -m app.modules.sysbackup.cli --help > /dev/null
          docker exec -w /app ngcorion python -m app.modules.audit_archive --help > /dev/null

  appliance:
    name: Appliance (Packer template, OVA packaging)
    # The VM build itself needs a hypervisor and runs with appliance/build.sh;
    # here: the Packer template is valid and formatted, the provisioning
    # scripts parse, and make-ova.sh packs a (blank) disk into an OVA whose
    # descriptor and manifest are right. The console code is tested by pytest
    # (tests/test_appliance.py) in the backend job.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKER_VERSION: "1.16.1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Packer and qemu-img
        run: |
          curl -fsSLo /tmp/packer.zip "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          sudo unzip -o /tmp/packer.zip -d /usr/local/bin
          sudo apt-get update && sudo apt-get install -y qemu-utils
      - name: Packer template
        working-directory: appliance
        run: |
          packer init "$PWD/packer"
          packer fmt -check -diff packer
          mkdir -p /tmp/stage
          packer validate -var version=ci -var build_password=ci -var stage_dir=/tmp/stage \
            -var output_dir=/tmp/qemu-out "$PWD/packer"
      - name: Provisioning scripts parse
        run: for f in appliance/provision/*.sh; do sh -n "$f"; done; bash -n appliance/build.sh appliance/make-ova.sh
      - name: OVA packaging
        run: |
          qemu-img create -f qcow2 /tmp/disk.qcow2 2G
          appliance/make-ova.sh /tmp/disk.qcow2 ci /tmp/ova
          mkdir /tmp/ova/x && tar -C /tmp/ova/x -xf /tmp/ova/ngcorion-ci.ova
          test "$(tar tf /tmp/ova/ngcorion-ci.ova | head -n1)" = ngcorion-ci.ovf
          cd /tmp/ova/x && sed -E 's/^SHA256\((.*)\)= (.*)$/\2  \1/' ngcorion-ci.mf | sha256sum -c -
          grep -q 'ovf:capacity="2147483648"' ngcorion-ci.ovf

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Every UI text has a Persian translation
        run: npm run i18n:check
      - name: Production build
        run: npm run build

  dependencies:
    name: Dependencies (known vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Python packages (pip-audit, against uv.lock)
        # Exceptions, each reviewed (see SECURITY.md, "Dependency exceptions"):
        #   PYSEC-2026-2858 / CVE-2026-44405 - paramiko 4 still allows SHA-1
        #     (ssh-rsa signatures, sha1 key exchange) as a fallback. Paramiko 5
        #     removes it, which would make older network devices (IOS 12/15.0,
        #     old ESXi) unreachable for audit; SHA-2 is preferred whenever the
        #     device offers it.
        run: |
          uv export --frozen --format requirements-txt --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit --disable-pip --no-deps --strict -r /tmp/requirements.txt \
            --ignore-vuln PYSEC-2026-2858
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm packages (npm audit)
        working-directory: front
        run: npm audit --audit-level=moderate

  docs:
    name: Documents (Persian PDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Chromium for printing
        run: uv run --no-project --with playwright==1.63.0 python -m playwright install --with-deps chromium
      - name: User and admin guides, architecture, Security Target, product overview and training course as PDF
        run: >-
          uv run --no-project --with markdown==3.5.2 --with playwright==1.63.0 --with pypdf==5.4.0
          python scripts/docs_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: ngcorion-docs-fa-pdf
          path: dist/docs/*.pdf
          if-no-files-found: error
