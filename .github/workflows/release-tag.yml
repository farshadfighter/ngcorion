# Creates a release tag and builds its appliance: Actions -> "Release tag" ->
# Run workflow.
#
# The version must be VERSION in app/core/config.py at that commit, and an
# existing tag is never moved. The tag is annotated and made by GitHub
# Actions, so who started it is on record in the run. Then the appliance
# workflow builds that tag (a tag pushed by Actions does not start other
# workflows by itself, so it is started here). See docs/RELEASING.md.
name: Release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v (e.g. 2.1.0-rc.1)"
        required: true
      ref:
        description: "Commit or branch to tag"
        required: false
        default: main
      build_appliance:
        description: "Build the appliance for the tag (draft release)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write   # start the appliance workflow

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check and create the tag
        env:
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::$VERSION is not a semantic version"; exit 1; }
          code="$(sed -n 's/^ *VERSION: str = "\(.*\)"/\1/p' app/core/config.py | head -n1)"
          [ "$code" = "$VERSION" ] || { echo "::error::the code at this commit is version $code, not $VERSION"; exit 1; }
          # An image without the license server's public key refuses every license (app/core/license_keys.py).
          python3 -c "import importlib.util as u; s = u.spec_from_file_location('k', 'app/core/license_keys.py'); m = u.module_from_spec(s); s.loader.exec_module(m); raise SystemExit(0 if m.TRUSTED_LICENSE_KEYS else 1)" \
            || { echo "::error::TRUSTED_LICENSE_KEYS in app/core/license_keys.py is empty: this build would refuse every license"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION exists already; tags are never moved"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "NGCorion $VERSION (tagged by $ACTOR)"
          git push origin "v$VERSION"
          echo "Tagged $(git rev-parse --short HEAD) as v$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the appliance for the tag
        if: inputs.build_appliance && hashFiles('.github/workflows/appliance.yml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run appliance.yml --ref "v$VERSION" -f tag="v$VERSION"
          echo "Appliance build started for v$VERSION (Actions -> Appliance)" >> "$GITHUB_STEP_SUMMARY"
