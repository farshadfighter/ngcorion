services:
  traefik:
    image: docker.arvancloud.ir/traefik:v3.7
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - app

  # Application backend (FastAPI). Also serves the built React SPA from
  # front/dist directly (no nginx) — see app/main.py's SPA catch-all. Traefik
  # terminates TLS and forwards ALL Host(`ngcorion.local`) traffic here; the
  # backend routes /api, /auth, /docs, /static itself and returns the SPA
  # shell for everything else. Never publishes a host port.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.netease
      target: development
    container_name: backend
    volumes:
      - ./app:/app/app
      - ./front/dist:/app/front/dist:ro
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      # Persist the activated license (encrypted) across container recreates so
      # the app doesn't fall back to license-locked and need re-activation.
      # LICENSE_STORAGE_DIR defaults to ~/.license and the container runs as
      # root, so this is /root/.license.
      - license_client_data:/root/.license
    environment:
      DATABASE_URL: postgresql+psycopg://netease:1234@postgres:5432/netease_db
      REDIS_URL: redis://redis:6379/0
      # Reach the license server over the docker network by its service name.
      # Without this the default (http://localhost:8001) resolves to the backend
      # container itself, so the app can never validate/activate a license and
      # stays license-locked.
      LICENSE_SERVER_URL: http://license-server:8001
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      license-server:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # HTTPS: the backend serves both the API and the React SPA, so a single
      # Host rule covers every path on this domain.
      - "traefik.http.routers.backend.rule=Host(`ngcorion.local`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Redirect plain-HTTP requests for ngcorion.local to HTTPS. Scoped to
      # this Host only so other dev routers on entrypoint "web" (e.g.
      # license.netease.localhost) are unaffected.
      - "traefik.http.middlewares.ngcorion-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.backend-http.rule=Host(`ngcorion.local`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=ngcorion-https-redirect"
      - "traefik.http.routers.backend-http.service=backend"
    networks:
      - app

  postgres:
    image: docker.arvancloud.ir/postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: netease_db
      POSTGRES_USER: netease
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres-main/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netease -d netease_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

  redis:
    image: docker.arvancloud.ir/redis:8-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
      - ./db/redis/redis.conf:/usr/local/etc/redis/redis.conf
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app

  # --- License Server -------------------------------------------------------
  postgres-license:
    image: docker.arvancloud.ir/postgres:17-alpine
    container_name: postgres-license
    restart: always
    environment:
      POSTGRES_DB: license_db
      POSTGRES_USER: license_user
      POSTGRES_PASSWORD: license1234
    volumes:
      - postgres_license_data:/var/lib/postgresql/data
      - ./db/postgres-license/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U license_user -d license_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

  license-server:
    build:
      context: ./license_server
      dockerfile: Dockerfile
    container_name: license-server
    restart: always
    environment:
      DATABASE_URL: postgresql://license_user:license1234@postgres-license:5432/license_db
      SECRET_KEY: change-this-license-secret-key-in-production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "12qw!@QW"
    ports:
      - "8001:8001"
    depends_on:
      postgres-license:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.license-server.rule=Host(`license.netease.localhost`)"
      - "traefik.http.routers.license-server.entrypoints=web"
      - "traefik.http.services.license-server.loadbalancer.server.port=8001"
    networks:
      - app

  license-admin:
    build:
      context: ./license-admin-ui
      dockerfile: Dockerfile.dev
    container_name: license-admin
    restart: always
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./license-admin-ui:/app
      - license_admin_node_modules:/app/node_modules
    environment:
      LICENSE_SERVER_URL: http://license-server:8001
    ports:
      - "5174:5173"
    depends_on:
      - license-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.license-admin.rule=Host(`license-admin.netease.localhost`)"
      - "traefik.http.routers.license-admin.entrypoints=web"
      - "traefik.http.services.license-admin.loadbalancer.server.port=5173"
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  postgres_license_data:
  license_admin_node_modules:
  license_client_data:

networks:
  app:
    name: app

