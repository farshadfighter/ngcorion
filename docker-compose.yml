services:
  traefik:
    restart: always
    image: docker.arvancloud.ir/traefik:v3.7
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # NOTE: --api.insecure=true is deliberately absent. It served Traefik's
      # API *and* dashboard on :8080 with no authentication whatsoever, exposing
      # the full routing topology (every router, service, middleware and backend
      # address) to anyone who could reach the host. Nothing in this stack needs
      # it: routing comes from the Docker provider labels and the file provider
      # in traefik/dynamic/, and no router publishes api@internal. The license
      # stack's Traefik (deploy/docker-compose.license.yml) already runs this way.
      # To inspect the dashboard temporarily: add "--api.insecure=true" back,
      # `docker compose up -d traefik`, then tunnel from your workstation
      # (`ssh -L 8080:127.0.0.1:8080 <user>@<deployment-host>`) and open
      # http://127.0.0.1:8080/dashboard/ locally. Remove the flag afterwards —
      # the port below is loopback-only precisely so it is never published.
    ports:
      - "80:80"
      - "443:443"
      # Traefik management port. Bound to loopback by default so it is not
      # reachable from the network even if the API is switched on for debugging;
      # override only for an admin-only interface, never 0.0.0.0. Same pattern as
      # LICENSE_BIND_ADDR in deploy/docker-compose.license.yml.
      # With the API disabled (above) nothing listens here — the mapping is kept
      # so the scoping is already correct if it is ever re-enabled.
      - "${TRAEFIK_BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - app

  backend:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.ngcorion
      # production: no dev-only Python packages in the image, and uvicorn runs
      # multi-worker without --reload (see Dockerfile.ngcorion's two CMDs).
      # This stack sits behind Traefik with real TLS and serves real traffic,
      # so it should not run the development image/entrypoint.
      target: production
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.arvancloud.ir}
        NGCORION_VERSION: ${NGCORION_TAG:-latest}
        # Optional npm mirror for the frontend build stage.
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        # Python package index (default in the Dockerfile: the Iranian mirror).
        PYPI_INDEX: ${PYPI_INDEX:-https://mirror-pypi.runflare.com/simple}
    container_name: backend
    # No `user:` here on purpose. The container starts as root only so
    # entrypoint.sh can hand the paths the app writes (license volume,
    # /etc/ngcorion, the managed snmpd/rsyslog/timesyncd files, traefik certs)
    # to UID 10001; it then drops to that account before migrations and the
    # server start. Setting `user: "10001:10001"` also works once those paths
    # are already owned by 10001 on the host.
    cap_add:
      # For the manual-clock setting: a dedicated copy of `date` in the image
      # carries CAP_SYS_TIME as a file capability, which only works while the
      # capability is in the container's bounding set.
      - SYS_TIME
      # No NET_ADMIN: nothing uses it. UDP discovery needs only NET_RAW (in
      # Docker's default set), granted to nmap as a file capability; every
      # iptables/ip-link reference is a remote command sent to an audited device.
    # The image carries the code and the built frontend (Dockerfile.ngcorion);
    # nothing of the checkout is mounted. A new release is a new image:
    # ./deploy.sh rebuilds it. For development with live code, add
    # docker-compose.dev.yml (see that file).
    image: ngcorion/backend:${NGCORION_TAG:-latest}
    # The installation's own settings and secrets - .env next to this file:
    # SECRET_KEY, SMTP_*, ... (app/core/config.py). They reach the app as
    # environment variables at run time and are never part of the image.
    # (Before .dockerignore existed, `COPY . .` baked .env into the image and
    # the app read it from /app/.env.) Values under `environment:` below
    # take precedence over the file.
    env_file:
      - path: .env
        required: false
    volumes:
      # License activation data (Fernet key + encrypted license/state files).
      # Moved off /root/.license for item 2.2: the backend no longer runs as
      # root, and /root is 0700 root-owned, so the old mount point was
      # unreachable for UID 10001. The volume itself is unchanged — same name,
      # same contents, new mount point — and LICENSE_STORAGE_DIR below points
      # the app at it.
      #
      # MIGRATING AN EXISTING DEPLOYMENT: the files already in this volume were
      # written by root with mode 0600, so UID 10001 cannot read them and the
      # app would come up unlicensed. Hand them over once, on the deployment
      # host, while the stack is down:
      #   docker run --rm -v license_client_data:/v alpine \
      #     chown -R 10001:10001 /v
      # A fresh install needs no such step: Docker seeds an empty volume from
      # the image directory, which Dockerfile.ngcorion already creates owned by
      # 10001.
      - license_client_data:/var/lib/ngcorion/license
      # The license is bound to this machine. Its identity comes from the
      # host's machine-id (here) and the hardware/VM UUID, which entrypoint.sh
      # reads as root - see app/core/machine_fingerprint.py. Without them the
      # fingerprint falls back to weaker sources.
      - /etc/machine-id:/host/machine-id:ro
      # NGCorion self-backups (Settings > NGCorion backup): encrypted .ngbak
      # archives of the database and the certificate / SSH host keys. A named
      # volume, so Docker seeds it owned by UID 10001 from the image. Keep
      # copies off this host too - add an SFTP or Windows share destination.
      - ngcorion_backups:/var/lib/ngcorion/backups
      - /etc/snmp:/etc/snmp
      - /etc/rsyslog.d:/etc/rsyslog.d
      - /etc/systemd/timesyncd.conf:/etc/systemd/timesyncd.conf
      - /etc/ngcorion:/etc/ngcorion
      - ./traefik/certs:/app/traefik/certs
      - ./traefik/dynamic:/app/traefik/dynamic
      - /usr/bin/timedatectl:/usr/bin/timedatectl
      # CVE database snapshot shipped with a release (bundle.ngcve), offered
      # on the CVE page's first run. Read-only; an empty folder just means
      # "no bundled snapshot" and the page offers a download or a package.
      - ./data/cve:/app/data/cve:ro
      - /run/systemd:/run/systemd
    environment:
      DATABASE_URL: postgresql+psycopg://netease:${POSTGRES_PASSWORD:-1234}@postgres:5432/netease_db
      # Uvicorn only trusts X-Forwarded-For/X-Forwarded-Proto from a peer in
      # FORWARDED_ALLOW_IPS, which defaults to "127.0.0.1". Traefik reaches
      # this container over the "app" bridge network, not loopback, so its
      # connecting IP never matched that default: every request.client.host
      # (and therefore every LoginLog row, and the per-IP login/password-reset
      # rate limiters in app/core/auth_rate_limiter.py) silently fell back to
      # Traefik's own container IP for every user, both breaking the audit
      # trail and letting a handful of failed logins from anyone rate-limit
      # every user. "*" is safe here specifically because this container's
      # port 8000 is only `expose`d, never `ports`-published - nothing but
      # another container on this compose network can reach uvicorn directly
      # to forge the header, and Traefik is the only thing that does.
      FORWARDED_ALLOW_IPS: "*"
      # The license server is always https://lic.ngcorion.com, built into the
      # code (app/core/license_keys.py); there is nothing to configure. This
      # host must resolve that name and reach it on port 443.
      # Where the license key/state files live inside the container. Set
      # explicitly rather than left to the "~/.license" default: the backend now
      # runs as UID 10001, whose home is /home/ngcorion, so "~" would silently
      # resolve to a path that is NOT the mounted volume and the app would come
      # up unlicensed. Must match the license_client_data mount point above.
      LICENSE_STORAGE_DIR: /var/lib/ngcorion/license
      # CVE database (see .env.example): the key that signs release snapshots,
      # and optional internal mirrors of the NVD / CISA KEV / EPSS feeds.
      CVE_RELEASE_PUBLIC_KEY: ${CVE_RELEASE_PUBLIC_KEY:-}
      NVD_API_URL: ${NVD_API_URL:-}
      CVE_KEV_URL: ${CVE_KEV_URL:-}
      CVE_EPSS_URL: ${CVE_EPSS_URL:-}
      CVE_MAX_PACKAGE_MB: ${CVE_MAX_PACKAGE_MB:-2048}
    expose:
      - "8000"
    ports:
      # Syslog from the assets (Network & monitoring -> Syslog, off until a system administrator
      # turns it on). The app does not run as root, so it listens on 5514; the host's standard
      # port 514 is published to it. Docker's port mapping keeps the sender's address, which is
      # how a message is matched to its asset. Port 8000 stays unpublished (see FORWARDED_ALLOW_IPS).
      - "${SYSLOG_BIND_ADDR:-0.0.0.0}:514:5514/udp"
      - "${SYSLOG_BIND_ADDR:-0.0.0.0}:514:5514/tcp"
    # /health answers 503 when the database is unreachable (app/modules/system_health.py).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      # The first start applies every migration to an empty database before
      # the server listens; on a slow VM that takes minutes. Failures in this
      # period do not count, so the container is not marked unhealthy (and
      # Traefik does not refuse to route to it) while it is still starting.
      start_period: 600s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.ngcorion-https-redirect.redirectscheme.scheme=https"
      # ngcorion.local — HTTPS
      - "traefik.http.routers.backend.rule=Host(`ngcorion.local`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.service=backend"
      # ngcorion.local — HTTP→HTTPS redirect
      - "traefik.http.routers.backend-http.rule=Host(`ngcorion.local`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=ngcorion-https-redirect"
      - "traefik.http.routers.backend-http.service=backend"
      # هر IP دیگه‌ای — HTTPS (بدون نیاز به تغییر IP)
      - "traefik.http.routers.backend-ip.rule=PathPrefix(`/`)"
      - "traefik.http.routers.backend-ip.entrypoints=websecure"
      - "traefik.http.routers.backend-ip.tls=true"
      - "traefik.http.routers.backend-ip.service=backend"
      - "traefik.http.routers.backend-ip.priority=1"
      # هر IP دیگه‌ای — HTTP→HTTPS redirect
      - "traefik.http.routers.backend-ip-http.rule=PathPrefix(`/`)"
      - "traefik.http.routers.backend-ip-http.entrypoints=web"
      - "traefik.http.routers.backend-ip-http.middlewares=ngcorion-https-redirect"
      - "traefik.http.routers.backend-ip-http.service=backend"
      - "traefik.http.routers.backend-ip-http.priority=1"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    networks:
      - app

  postgres:
    restart: always
    image: docker.arvancloud.ir/postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: netease_db
      POSTGRES_USER: netease
      # TEMPORARY: falls back to the published development password (1234),
      # kept on purpose for now. Set POSTGRES_PASSWORD in .env to change it -
      # only read when the data volume is first initialised, see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres-main/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netease -d netease_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      # The very first start creates the database cluster (initdb), which can
      # take minutes on slow storage; failures during this period do not
      # count, so the backend (depends_on: service_healthy) is not given up on.
      start_period: 300s
    networks:
      - app

volumes:
  postgres_data:
  license_client_data:
  ngcorion_backups:

networks:
  app:
    name: app
