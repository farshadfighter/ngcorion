services:
  traefik:
    restart: always
    image: docker.arvancloud.ir/traefik:v3.7
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # NOTE: --api.insecure=true is deliberately absent. It served Traefik's
      # API *and* dashboard on :8080 with no authentication whatsoever, exposing
      # the full routing topology (every router, service, middleware and backend
      # address) to anyone who could reach the host. Nothing in this stack needs
      # it: routing comes from the Docker provider labels and the file provider
      # in traefik/dynamic/, and no router publishes api@internal. The license
      # stack's Traefik (deploy/docker-compose.license.yml) already runs this way.
      # To inspect the dashboard temporarily: add "--api.insecure=true" back,
      # `docker compose up -d traefik`, then tunnel from your workstation
      # (`ssh -L 8080:127.0.0.1:8080 <user>@<deployment-host>`) and open
      # http://127.0.0.1:8080/dashboard/ locally. Remove the flag afterwards —
      # the port below is loopback-only precisely so it is never published.
    ports:
      - "80:80"
      - "443:443"
      # Traefik management port. Bound to loopback by default so it is not
      # reachable from the network even if the API is switched on for debugging;
      # override only for an admin-only interface, never 0.0.0.0. Same pattern as
      # LICENSE_BIND_ADDR in deploy/docker-compose.license.yml.
      # With the API disabled (above) nothing listens here — the mapping is kept
      # so the scoping is already correct if it is ever re-enabled.
      - "${TRAEFIK_BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - app

  backend:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.ngcorion
      target: development
    container_name: backend
    user: root
    cap_add:
      - SYS_TIME
      - NET_ADMIN
    volumes:
      - ./app:/app/app
      - ./front/dist:/app/front/dist:ro
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - license_client_data:/root/.license
      - /etc/snmp:/etc/snmp
      - /etc/rsyslog.d:/etc/rsyslog.d
      - /etc/systemd/timesyncd.conf:/etc/systemd/timesyncd.conf
      - /etc/ngcorion:/etc/ngcorion
      - ./traefik/certs:/app/traefik/certs
      - ./traefik/dynamic:/app/traefik/dynamic
      - /usr/bin/timedatectl:/usr/bin/timedatectl
      - /run/systemd:/run/systemd
    environment:
      DATABASE_URL: postgresql+psycopg://netease:${POSTGRES_PASSWORD:-1234}@postgres:5432/netease_db
      # No application code uses Redis today; the variable is kept for forward
      # compatibility. (The license server, which used DB 1 of this instance,
      # now runs on its own host with its own Redis.)
      REDIS_URL: redis://redis:6379/0
      # REQUIRED — the license server runs on a separate host. Set it in .env,
      # e.g. LICENSE_SERVER_URL=https://172.16.120.81:443
      # There is deliberately no fallback: the backend refuses to start on an
      # empty value rather than silently pointing nowhere.
      # See docs/LICENSE_SERVER_MIGRATION.md and deploy/docker-compose.license.yml.
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL}
      # The license server is internal and reached by IP, so it serves a
      # self-signed certificate. This is the copy of that certificate used to
      # verify it — full verification stays on, it just trusts the right issuer.
      # The path is inside the container; ./traefik/certs is already mounted at
      # /app/traefik/certs below, so drop license-server.crt in there.
      LICENSE_SERVER_CA_BUNDLE: ${LICENSE_SERVER_CA_BUNDLE:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.ngcorion-https-redirect.redirectscheme.scheme=https"
      # ngcorion.local — HTTPS
      - "traefik.http.routers.backend.rule=Host(`ngcorion.local`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.service=backend"
      # ngcorion.local — HTTP→HTTPS redirect
      - "traefik.http.routers.backend-http.rule=Host(`ngcorion.local`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=ngcorion-https-redirect"
      - "traefik.http.routers.backend-http.service=backend"
      # هر IP دیگه‌ای — HTTPS (بدون نیاز به تغییر IP)
      - "traefik.http.routers.backend-ip.rule=PathPrefix(`/`)"
      - "traefik.http.routers.backend-ip.entrypoints=websecure"
      - "traefik.http.routers.backend-ip.tls=true"
      - "traefik.http.routers.backend-ip.service=backend"
      - "traefik.http.routers.backend-ip.priority=1"
      # هر IP دیگه‌ای — HTTP→HTTPS redirect
      - "traefik.http.routers.backend-ip-http.rule=PathPrefix(`/`)"
      - "traefik.http.routers.backend-ip-http.entrypoints=web"
      - "traefik.http.routers.backend-ip-http.middlewares=ngcorion-https-redirect"
      - "traefik.http.routers.backend-ip-http.service=backend"
      - "traefik.http.routers.backend-ip-http.priority=1"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    networks:
      - app

  postgres:
    restart: always
    image: docker.arvancloud.ir/postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: netease_db
      POSTGRES_USER: netease
      # Development default. Set POSTGRES_PASSWORD in .env for any real deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres-main/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netease -d netease_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

  redis:
    restart: always
    image: docker.arvancloud.ir/redis:8-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
      - ./db/redis/redis.conf:/usr/local/etc/redis/redis.conf
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  license_client_data:

networks:
  app:
    name: app
