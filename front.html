<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netease API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: #2d3748;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .section {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .section:last-child {
            border-bottom: none;
        }
        
        h2 {
            color: #2d3748;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #4a5568;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            font-size: 14px;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        button.danger {
            background: #f56565;
        }
        
        button.danger:hover {
            background: #e53e3e;
        }
        
        .response {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .response pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.error {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .hidden {
            display: none;
        }
        
        .asset-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .asset-card {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            background: #f7fafc;
        }
        
        .asset-card h3 {
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .asset-card p {
            margin: 5px 0;
            color: #4a5568;
            font-size: 14px;
        }
        
        .asset-card .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .badge.active {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .badge.standby {
            background: #feebc8;
            color: #7c2d12;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Netease API Test Interface</h1>
            <p>Complete Asset Management Testing</p>
        </div>

        <!-- Login Section -->
        <div class="section" id="loginSection">
            <h2>🔐 1. Login</h2>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="loginUsername" value="admin">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="loginPassword" value="123456">
            </div>
            <button onclick="login()">Login</button>
            <div id="loginResponse" class="response hidden"></div>
        </div>

        <!-- Asset Types Section -->
        <div class="section hidden" id="assetTypesSection">
            <h2>📋 2. Asset Types</h2>
            <button onclick="getAssetTypes()">Get All Asset Types</button>
            <div id="assetTypesResponse" class="response hidden"></div>
        </div>

        <!-- Create Owner Section -->
        <div class="section hidden" id="ownerSection">
            <h2>👤 3. Create Owner</h2>
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" id="ownerName" value="Ali Rezaei">
            </div>
            <div class="form-group">
                <label>Department:</label>
                <input type="text" id="ownerDept" value="Network">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="ownerEmail" value="ali@company.com">
            </div>
            <button onclick="createOwner()">Create Owner</button>
            <div id="ownerResponse" class="response hidden"></div>
        </div>

        <!-- Create Location Section -->
        <div class="section hidden" id="locationSection">
            <h2>📍 4. Create Location</h2>
            <div class="form-group">
                <label>Site Name:</label>
                <input type="text" id="locationSite" value="Main Data Center">
            </div>
            <div class="form-group">
                <label>Rack Name:</label>
                <input type="text" id="locationRack" value="Rack-12">
            </div>
            <div class="form-group">
                <label>Network Zone:</label>
                <input type="text" id="locationZone" value="DMZ">
            </div>
            <button onclick="createLocation()">Create Location</button>
            <div id="locationResponse" class="response hidden"></div>
        </div>

        <!-- Create Asset Section -->
        <div class="section hidden" id="assetSection">
            <h2>🖥️ 5. Create Asset</h2>
            <div class="form-group">
                <label>Asset Name:</label>
                <input type="text" id="assetName" value="FW-Main-01">
            </div>
            <div class="form-group">
                <label>Hostname:</label>
                <input type="text" id="assetHostname" value="fw-main.local">
            </div>
            <div class="form-group">
                <label>Asset Type ID:</label>
                <input type="number" id="assetTypeId" value="1">
            </div>
            <div class="form-group">
                <label>Manufacturer:</label>
                <input type="text" id="assetManufacturer" value="Fortinet">
            </div>
            <div class="form-group">
                <label>Model:</label>
                <input type="text" id="assetModel" value="FortiGate 600E">
            </div>
            <div class="form-group">
                <label>IP Address:</label>
                <input type="text" id="assetIp" value="10.0.0.1">
            </div>
            <div class="form-group">
                <label>Owner ID:</label>
                <input type="number" id="assetOwnerId" value="1">
            </div>
            <div class="form-group">
                <label>Location ID:</label>
                <input type="number" id="assetLocationId" value="1">
            </div>
            <button onclick="createAsset()">Create Asset</button>
            <div id="assetResponse" class="response hidden"></div>
        </div>

        <!-- Asset List Section -->
        <div class="section hidden" id="assetListSection">
            <h2>📊 6. Asset List</h2>
            <button onclick="getAssets()">Refresh Assets</button>
            <button onclick="deleteAllAssets()" class="danger">Delete All Assets</button>
            <div id="assetListResponse" class="asset-list"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let token = null;

        // Login
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                const responseDiv = document.getElementById('loginResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    token = data.access_token;
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Login Successful!</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    
                    // Show other sections
                    document.getElementById('assetTypesSection').classList.remove('hidden');
                    document.getElementById('ownerSection').classList.remove('hidden');
                    document.getElementById('locationSection').classList.remove('hidden');
                    document.getElementById('assetSection').classList.remove('hidden');
                    document.getElementById('assetListSection').classList.remove('hidden');
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Login Failed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('loginResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Get Asset Types
        async function getAssetTypes() {
            try {
                const response = await fetch(`${API_BASE}/asset-types/`);
                const data = await response.json();
                
                const responseDiv = document.getElementById('assetTypesResponse');
                responseDiv.classList.remove('hidden');
                responseDiv.innerHTML = `
                    <div class="status success">✅ Success</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('assetTypesResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Create Owner
        async function createOwner() {
            const data = {
                full_name: document.getElementById('ownerName').value,
                department: document.getElementById('ownerDept').value,
                email: document.getElementById('ownerEmail').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/asset-types/owners`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const responseDiv = document.getElementById('ownerResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Owner Created!</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Failed</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('ownerResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Create Location
        async function createLocation() {
            const data = {
                site_name: document.getElementById('locationSite').value,
                rack_name: document.getElementById('locationRack').value,
                network_zone: document.getElementById('locationZone').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/asset-types/locations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const responseDiv = document.getElementById('locationResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Location Created!</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Failed</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('locationResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Create Asset
        async function createAsset() {
            const data = {
                asset_name: document.getElementById('assetName').value,
                hostname: document.getElementById('assetHostname').value,
                asset_type_id: parseInt(document.getElementById('assetTypeId').value),
                manufacturer: document.getElementById('assetManufacturer').value,
                model: document.getElementById('assetModel').value,
                ip_address: document.getElementById('assetIp').value,
                owner_id: parseInt(document.getElementById('assetOwnerId').value),
                location_id: parseInt(document.getElementById('assetLocationId').value),
                status: "active",
                user_id: 1
            };
            
            try {
                const response = await fetch(`${API_BASE}/asset-types/assets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const responseDiv = document.getElementById('assetResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Asset Created!</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                    getAssets(); // Refresh list
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Failed</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('assetResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Get Assets
        async function getAssets() {
            try {
                const response = await fetch(`${API_BASE}/asset-types/assets`);
                const data = await response.json();
                
                const listDiv = document.getElementById('assetListResponse');
                listDiv.innerHTML = '';
                
                if (data.length === 0) {
                    listDiv.innerHTML = '<p style="text-align:center; color:#718096;">No assets found</p>';
                    return;
                }
                
                data.forEach(asset => {
                    const card = document.createElement('div');
                    card.className = 'asset-card';
                    card.innerHTML = `
                        <h3>${asset.asset_name}</h3>
                        <p><strong>ID:</strong> ${asset.id}</p>
                        <p><strong>Hostname:</strong> ${asset.hostname || 'N/A'}</p>
                        <p><strong>IP:</strong> ${asset.ip_address || 'N/A'}</p>
                        <p><strong>Type:</strong> ${asset.asset_type_id}</p>
                        <p><strong>Manufacturer:</strong> ${asset.manufacturer || 'N/A'}</p>
                        <span class="badge ${asset.status}">${asset.status}</span>
                        <div style="margin-top: 10px;">
                            <button onclick="deleteAsset(${asset.id})" class="danger" style="font-size: 12px; padding: 5px 10px;">Delete</button>
                        </div>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (error) {
                document.getElementById('assetListResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Delete Asset
        async function deleteAsset(id) {
            if (!confirm('Are you sure you want to delete this asset?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/asset-types/assets/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    alert('Asset deleted successfully!');
                    getAssets(); // Refresh list
                } else {
                    alert('Failed to delete asset');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Delete All Assets
        async function deleteAllAssets() {
            if (!confirm('Are you sure you want to delete ALL assets? This cannot be undone!')) return;
            
            try {
                const response = await fetch(`${API_BASE}/asset-types/assets`);
                const assets = await response.json();
                
                for (const asset of assets) {
                    await fetch(`${API_BASE}/asset-types/assets/${asset.id}`, {
                        method: 'DELETE'
                    });
                }
                
                alert('All assets deleted!');
                getAssets(); // Refresh list
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
