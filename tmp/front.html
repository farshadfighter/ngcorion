<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netease Asset Management - Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .user-info {
            background: #4a5568;
            padding: 10px 30px;
            color: white;
            display: none;
        }
        
        .user-info.active {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section {
            padding: 30px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .section:last-child {
            border-bottom: none;
        }
        
        .section.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        
        h2 {
            color: #2d3748;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
            font-size: 1.8em;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95em;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.danger {
            background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
        }
        
        button.secondary {
            background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
        }
        
        .response {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .response pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.error {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .hidden {
            display: none !important;
        }
        
        .asset-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .asset-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f7fafc 100%);
            transition: all 0.3s;
        }
        
        .asset-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.2);
            transform: translateY(-4px);
        }
        
        .asset-card h3 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .asset-card p {
            margin: 8px 0;
            color: #4a5568;
            font-size: 14px;
        }
        
        .asset-card p strong {
            color: #2d3748;
            display: inline-block;
            min-width: 100px;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
        }
        
        .badge.active {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .badge.standby {
            background: #feebc8;
            color: #7c2d12;
        }
        
        .badge.decommissioned {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
            font-size: 1.2em;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Netease Asset Management</h1>
            <p class="subtitle">Complete API Testing Interface with JWT Authentication</p>
        </div>

        <div class="user-info" id="userInfo">
            <div>
                <strong>Logged in as:</strong> <span id="currentUser"></span> | 
                <strong>Role:</strong> <span id="currentRole"></span>
            </div>
            <button onclick="logout()" class="secondary">Logout</button>
        </div>

        <!-- Login Section -->
        <div class="section" id="loginSection">
            <h2>🔐 Step 1: Authentication</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="loginUsername" value="admin" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="loginPassword" value="123456" placeholder="Enter password">
                </div>
            </div>
            <div class="button-group">
                <button onclick="login()">🔑 Login</button>
            </div>
            <div id="loginResponse" class="response hidden"></div>
        </div>

        <!-- Asset Types Section -->
        <div class="section disabled" id="assetTypesSection">
            <h2>📋 Step 2: Asset Types</h2>
            <div class="button-group">
                <button onclick="getAssetTypes()">📥 Get All Asset Types</button>
            </div>
            <div id="assetTypesResponse" class="response hidden"></div>
        </div>

        <!-- Create Owner Section -->
        <div class="section disabled" id="ownerSection">
            <h2>👤 Step 3: Create Asset Owner</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" id="ownerName" value="Ali Rezaei" placeholder="Full name">
                </div>
                <div class="form-group">
                    <label>Department:</label>
                    <input type="text" id="ownerDept" value="Network" placeholder="Department">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="ownerEmail" value="ali@company.com" placeholder="Email address">
                </div>
            </div>
            <div class="button-group">
                <button onclick="createOwner()">➕ Create Owner</button>
            </div>
            <div id="ownerResponse" class="response hidden"></div>
        </div>

        <!-- Create Location Section -->
        <div class="section disabled" id="locationSection">
            <h2>📍 Step 4: Create Location</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Site Name:</label>
                    <input type="text" id="locationSite" value="Main Data Center" placeholder="Site name">
                </div>
                <div class="form-group">
                    <label>Rack Name:</label>
                    <input type="text" id="locationRack" value="Rack-12" placeholder="Rack identifier">
                </div>
                <div class="form-group">
                    <label>Network Zone:</label>
                    <input type="text" id="locationZone" value="DMZ" placeholder="Network zone">
                </div>
            </div>
            <div class="button-group">
                <button onclick="createLocation()">➕ Create Location</button>
            </div>
            <div id="locationResponse" class="response hidden"></div>
        </div>

        <!-- Create Asset Section -->
        <div class="section disabled" id="assetSection">
            <h2>🖥️ Step 5: Create Asset</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Asset Name:</label>
                    <input type="text" id="assetName" value="FW-Main-01" placeholder="Asset name">
                </div>
                <div class="form-group">
                    <label>Hostname:</label>
                    <input type="text" id="assetHostname" value="fw-main.local" placeholder="Hostname">
                </div>
                <div class="form-group">
                    <label>Asset Type ID:</label>
                    <input type="number" id="assetTypeId" value="1" placeholder="Type ID">
                </div>
                <div class="form-group">
                    <label>Manufacturer:</label>
                    <input type="text" id="assetManufacturer" value="Fortinet" placeholder="Manufacturer">
                </div>
                <div class="form-group">
                    <label>Model:</label>
                    <input type="text" id="assetModel" value="FortiGate 600E" placeholder="Model">
                </div>
                <div class="form-group">
                    <label>IP Address:</label>
                    <input type="text" id="assetIp" value="10.0.0.1" placeholder="IP address">
                </div>
                <div class="form-group">
                    <label>Owner ID:</label>
                    <input type="number" id="assetOwnerId" value="1" placeholder="Owner ID">
                </div>
                <div class="form-group">
                    <label>Location ID:</label>
                    <input type="number" id="assetLocationId" value="1" placeholder="Location ID">
                </div>
            </div>
            <div class="button-group">
                <button onclick="createAsset()">➕ Create Asset</button>
            </div>
            <div id="assetResponse" class="response hidden"></div>
        </div>

        <!-- Asset List Section -->
        <div class="section disabled" id="assetListSection">
            <h2>📊 Step 6: Asset Management</h2>
            <div class="button-group">
                <button onclick="getAssets()">🔄 Refresh Assets</button>
                <button onclick="getAssetViews()" class="secondary">📋 View Asset Reports</button>
                <button onclick="deleteAllAssets()" class="danger">🗑️ Delete All Assets</button>
            </div>
            <div id="assetListResponse" class="asset-list"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let token = localStorage.getItem('token') || null;
        let currentUser = null;

        // Check if already logged in
        if (token) {
            verifyToken();
        }

        // Verify token on load
        async function verifyToken() {
            try {
                const response = await fetch(`${API_BASE}/api/assets/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    showLoggedInState();
                } else {
                    token = null;
                    localStorage.removeItem('token');
                }
            } catch (error) {
                console.error('Token verification failed:', error);
            }
        }

        // Login
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                const responseDiv = document.getElementById('loginResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    currentUser = { username, role: 'admin' }; // Should get from token
                    
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Login Successful!</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    
                    showLoggedInState();
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Login Failed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('loginResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Logout
        function logout() {
            token = null;
            currentUser = null;
            localStorage.removeItem('token');
            
            document.getElementById('userInfo').classList.remove('active');
            document.getElementById('loginSection').classList.remove('disabled');
            
            ['assetTypesSection', 'ownerSection', 'locationSection', 'assetSection', 'assetListSection'].forEach(id => {
                document.getElementById(id).classList.add('disabled');
            });
            
            document.getElementById('loginResponse').innerHTML = '<div class="status success">✅ Logged out successfully</div>';
        }

        // Show logged in state
        function showLoggedInState() {
            document.getElementById('userInfo').classList.add('active');
            document.getElementById('currentUser').textContent = currentUser?.username || 'Admin';
            document.getElementById('currentRole').textContent = currentUser?.role || 'Admin';
            document.getElementById('loginSection').classList.add('disabled');
            
            ['assetTypesSection', 'ownerSection', 'locationSection', 'assetSection', 'assetListSection'].forEach(id => {
                document.getElementById(id).classList.remove('disabled');
            });
            
            getAssets();
        }

        // Get Asset Types
        async function getAssetTypes() {
            try {
                const response = await fetch(`${API_BASE}/api/asset-types/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                const responseDiv = document.getElementById('assetTypesResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Found ${data.length} asset types</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Failed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('assetTypesResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Create Owner
        async function createOwner() {
            const data = {
                full_name: document.getElementById('ownerName').value,
                department: document.getElementById('ownerDept').value,
                email: document.getElementById('ownerEmail').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/owners/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const responseDiv = document.getElementById('ownerResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Owner Created! (ID: ${result.id})</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Failed</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('ownerResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Create Location
        async function createLocation() {
            const data = {
                site_name: document.getElementById('locationSite').value,
                rack_name: document.getElementById('locationRack').value,
                network_zone: document.getElementById('locationZone').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/locations/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const responseDiv = document.getElementById('locationResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Location Created! (ID: ${result.id})</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Failed</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('locationResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Create Asset
        async function createAsset() {
            const data = {
                asset_name: document.getElementById('assetName').value,
                hostname: document.getElementById('assetHostname').value,
                asset_type_id: parseInt(document.getElementById('assetTypeId').value),
                manufacturer: document.getElementById('assetManufacturer').value,
                model: document.getElementById('assetModel').value,
                ip_address: document.getElementById('assetIp').value,
                owner_id: parseInt(document.getElementById('assetOwnerId').value),
                location_id: parseInt(document.getElementById('assetLocationId').value),
                status: "active",
                user_id: 1
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/assets/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const responseDiv = document.getElementById('assetResponse');
                responseDiv.classList.remove('hidden');
                
                if (response.ok) {
                    responseDiv.innerHTML = `
                        <div class="status success">✅ Asset Created! (ID: ${result.id})</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                    getAssets();
                } else {
                    responseDiv.innerHTML = `
                        <div class="status error">❌ Failed</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                document.getElementById('assetResponse').innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Get Assets
        async function getAssets() {
            const listDiv = document.getElementById('assetListResponse');
            listDiv.innerHTML = '<div class="loading">⏳ Loading assets...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/assets/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                listDiv.innerHTML = '';
                
                if (!response.ok) {
                    listDiv.innerHTML = `<div class="status error">❌ Error: ${JSON.stringify(data)}</div>`;
                    return;
                }
                
                if (data.length === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                            </svg>
                            <h3>No Assets Found</h3>
                            <p>Create your first asset using the form above</p>
                        </div>
                    `;
                    return;
                }
                
                data.forEach(asset => {
                    const card = document.createElement('div');
                    card.className = 'asset-card';
                    card.innerHTML = `
                        <h3>🖥️ ${asset.asset_name}</h3>
                        <p><strong>ID:</strong> ${asset.id}</p>
                        <p><strong>Hostname:</strong> ${asset.hostname || 'N/A'}</p>
                        <p><strong>IP Address:</strong> ${asset.ip_address || 'N/A'}</p>
                        <p><strong>Type ID:</strong> ${asset.asset_type_id}</p>
                        <p><strong>Manufacturer:</strong> ${asset.manufacturer || 'N/A'}</p>
                        <p><strong>Model:</strong> ${asset.model || 'N/A'}</p>
                        <span class="badge ${asset.status}">${asset.status.toUpperCase()}</span>
                        <div style="margin-top: 15px;">
                            <button onclick="deleteAsset(${asset.id})" class="danger" style="font-size: 12px; padding: 8px 16px;">
                                🗑️ Delete
                            </button>
                        </div>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (error) {
                listDiv.innerHTML = `
                    <div class="status error">❌ Error: ${error.message}</div>
                `;
            }
        }

        // Delete Asset
        async function deleteAsset(id) {
            if (!confirm('Are you sure you want to delete this asset?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/assets/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    alert('✅ Asset deleted successfully!');
                    getAssets();
                } else {
                    const data = await response.json();
                    alert('❌ Failed to delete: ' + JSON.stringify(data));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // Delete All Assets
        async function deleteAllAssets() {
            if (!confirm('⚠️ WARNING: This will delete ALL assets! This cannot be undone!\n\nAre you absolutely sure?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/assets/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const assets = await response.json();
                
                let deleted = 0;
                for (const asset of assets) {
                    const delResponse = await fetch(`${API_BASE}/api/assets/${asset.id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (delResponse.ok) deleted++;
                }
                
                alert(`✅ Deleted ${deleted} assets!`);
                getAssets();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // Get Asset Views
        async function getAssetViews() {
            const views = ['overview', 'network-system', 'location-ownership', 'security-audit'];
            let html = '<h3>Asset Views:</h3>';
            
            for (const view of views) {
                try {
                    const response = await fetch(`${API_BASE}/api/asset-views/${view}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    html += `<h4>${view.toUpperCase()}</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } catch (error) {
                    html += `<p class="status error">Error loading ${view}</p>`;
                }
            }
            
            document.getElementById('assetListResponse').innerHTML = html;
        }
    </script>
</body>
</html>
