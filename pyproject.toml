[project]
name = "netease"
version = "2.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.12.0",
    "bcrypt>=4.0.1,<4.1.0",
    "cryptography>=43.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.100.0",
    "jinja2>=3.1",
    "ldap3>=2.9.1",
    "netmiko>=4.2.0",
    "openpyxl>=3.1.0",
    "packaging>=23.0",
    "paramiko>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "puresnmp>=2.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.13.4",
    "pymssql>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.32",
    "pywinrm>=0.4.3",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "smbprotocol>=1.13",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.23.0",
    "weasyprint>=62",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Lint (CI runs `ruff check`): pyflakes and syntax errors - unused or duplicate imports and
# variables, undefined names, f-strings without placeholders. Style is not enforced.
[tool.ruff]
target-version = "py313"
extend-exclude = ["alembic/versions"]  # released migrations are history, not edited

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# These modules import a pytest fixture from another test module; pytest injects it by name.
"tests/test_license_reliability.py" = ["F811"]
"tests/test_license_signed_client.py" = ["F811"]
"tests/test_offline_license.py" = ["F811"]
