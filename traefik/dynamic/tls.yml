# Dynamic (file provider) TLS config for Traefik.
# Loaded via the `--providers.file.directory=/etc/traefik/dynamic` command
# flag in docker-compose.yml. Supplies the self-signed cert for ngcorion.local
# (generated into traefik/certs/, see docs/DEPLOYMENT_GUIDE.md).
tls:
  certificates:
    - certFile: /etc/traefik/certs/ngcorion.local.crt
      keyFile: /etc/traefik/certs/ngcorion.local.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/ngcorion.local.crt
        keyFile: /etc/traefik/certs/ngcorion.local.key
  # Pinned rather than left to Traefik's defaults, so the floor cannot move
  # with an upgrade: TLS 1.2 and 1.3 only, and for 1.2 only forward-secret
  # AEAD suites (TLS 1.3 suites are all of that kind and not configurable).
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
