# ---------------------------------------------------------------------------
# Internal static file server for the built React SPA (front/dist).
# This is NOT the SSL/routing layer — Traefik (see traefik/) terminates TLS
# and forwards Host(`ngcorion.com`) traffic here on plain HTTP inside the
# docker network. This container is never published to a host port.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback so React Router (BrowserRouter) can resolve client-side
    # routes on refresh/deep-link (e.g. /audit/sessions/42).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
